[build-system]
# >=77 for PEP 639 license metadata (license = SPDX string + license-files)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vesp"
version = "0.2.0"
description = "MaxEnt-VESP equivalent-source gravity feasibility framework + VESP-UQ force-risk calibration layer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# CI tests exactly 3.12; the floor matches what is actually tested (R2WP-8: no untested floor).
requires-python = ">=3.12"
# torch stays a core dependency: the equivalent-source operators and the UQ layer import it at
# module level. UI (PyQt6) and plotting (matplotlib) are optional: headless analysis must not
# pull a GUI toolkit (R2WP-8). Plot helpers already import matplotlib lazily and degrade
# gracefully when it is missing.
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "PyYAML>=6.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
ui = ["PyQt6>=6.4.0", "matplotlib>=3.5.0"]
plots = ["matplotlib>=3.5.0"]
dev = ["pytest", "ruff==0.15.16", "hypothesis", "mypy", "vesp[ui]"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# --- N2: code-quality lint gate -------------------------------------------------------------
# Scoped (via the CI lint job) to the VESP-UQ surface, scripts, and tests:
#   ruff check src/vesp/uq scripts tests
# Lint only -- the formatter is available locally (`ruff format`) but is intentionally NOT gated
# in CI, so this stays a behavior-preserving bug/import hygiene check rather than a reformat.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W (pycodestyle), F (pyflakes -- catches stray/placeholder + unused imports), I (import
# sorting), B (bugbear -- real bug smells), UP (pyupgrade -- safe modernizations).
select = ["E", "F", "I", "W", "B", "UP"]
# E501 (line-too-long) is left to the formatter, which is not CI-gated here; line width is already
# self-disciplined in this codebase, so enforcing it would only churn the legacy Stage-1/2 scripts.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts, tests, and the UI launcher legitimately insert sys.path / configure the environment
# before importing `vesp`, so module-level imports are not all at the top of the file (E402).
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
"ui/*" = ["E402"]

[tool.ruff.format]
# Provided so `ruff format` works locally with the same line length; not enforced in CI (N2 scope).
line-ending = "lf"

[tool.mypy]
# N21: scoped type-checking gate for the maintained UQ/common/UI surface. The legacy feasibility
# tree and exploratory adapters stay outside this gate, mirroring the lint-scope decision.
python_version = "3.12"
mypy_path = "src"
files = ["src/vesp/uq", "src/vesp/common", "src/vesp/ui"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
warn_unused_ignores = false
warn_return_any = false
show_error_codes = true
